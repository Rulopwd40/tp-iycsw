# .github/workflows/ci.yml
# Workflow de integracion continua del repositorio SGRE (Sistema de Gestion de Recursos).
name: CI

# Eventos que disparan la integracion continua.
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:        # permite ejecutarlo a mano desde la pestania Actions

# Si se empuja un commit nuevo a la misma rama, se cancela la corrida anterior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compilar y testear
    runs-on: ubuntu-latest

    # El proyecto Maven vive en el subdirectorio tp-iycs/, no en la raiz del repo.
    defaults:
      run:
        working-directory: tp-iycs

    steps:
      # 1) Traer el codigo del repositorio al runner.
      - name: Checkout
        uses: actions/checkout@v4

      # 2) Instalar el JDK y cachear el repositorio local de Maven (~/.m2).
      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
          cache-dependency-path: tp-iycs/pom.xml

      # 3) Compilar sin ejecutar pruebas: falla rapido si hay errores de compilacion.
      - name: Compilar
        run: mvn -B -ntp clean compile

      # 4) Ejecutar las pruebas unitarias.
      - name: Pruebas unitarias
        run: mvn -B -ntp test

      # 5) Publicar los resultados aunque las pruebas fallen.
      - name: Reporte de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: tp-iycs/target/surefire-reports/

  analisis:
    name: Analisis estatico
    runs-on: ubuntu-latest
    needs: build              # solo corre si el job "build" paso

    defaults:
      run:
        working-directory: tp-iycs

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
          cache-dependency-path: tp-iycs/pom.xml

      # Requiere tener declarados los plugins checkstyle y spotbugs en el pom.xml.
      - name: Checkstyle y SpotBugs
        run: mvn -B -ntp checkstyle:check spotbugs:check